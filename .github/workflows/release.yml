name: Oscan Release

# Release contract schema 2: every published artifact is one (target,
# backend) pair — Windows/Linux ship llvm, cranelift and c packages, macOS
# ships c. The package job is keyed on the *target*, not on target x
# backend, because all of a target's variants reuse the same pinned
# toolchain download, the same freestanding runtime archives and the same
# native-link sidecar; fanning out per backend would repeat the most
# expensive work in the release three times per platform.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package (for example 0.1.0 or v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release after packaging (clear for a packaging-only run)"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Resolve release version and publish mode
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw="${INPUT_VERSION:-}"
          else
            raw="${REF_NAME:-}"
          fi
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          if [ -z "$raw" ]; then
            echo "a release version is required" >&2
            exit 1
          fi
          case "$raw" in
            v*)
              tag="$raw"
              version="${raw#v}"
              ;;
            *)
              version="$raw"
              tag="v$raw"
              ;;
          esac
          if [ -z "$version" ]; then
            echo "resolved release version was empty" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            publish=true
          elif [ "${INPUT_PUBLISH:-}" = "true" ]; then
            publish=true
          else
            publish=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "should_publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the release contract
        run: python3 scripts/release_tools.py validate-contract

      - name: Derive the package matrix from the release contract
        id: matrix
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/release_tools.py ci-matrix --version "$RELEASE_VERSION")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          python3 scripts/release_tools.py list-variants

  package:
    name: Package ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      # Matrix values are passed through the environment rather than
      # interpolated into script bodies, so nothing here depends on how a
      # given shell would quote them.
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BACKENDS: ${{ matrix.backends }}
      RELEASE_ARCHIVES: ${{ matrix.archives }}
      RELEASE_RUNTIME_PROFILES: ${{ matrix.runtime_profiles }}
      RELEASE_BINARY_NAME: ${{ matrix.binary_name }}
      RELEASE_BINARY_PATH: ${{ matrix.binary_path }}
      RELEASE_MSI_BACKEND: ${{ matrix.msi_backend }}
      RELEASE_NEEDS_PROVIDER_ARCHIVE: ${{ matrix.needs_provider_archive }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Only the downloaded crate sources are cached. target/ deliberately is
      # not: this job builds the same crate three times with three different,
      # mutually exclusive feature sets, and a shared target/ cache across
      # runs buys nothing there while risking a stale artifact being packaged.
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-cargo-${{ matrix.target }}-

      # The packaged LLVM code generator is dlopen()ed by the llvm package's
      # smoke test, so its shared-library dependencies must exist on the
      # runner even though they are never shipped.
      - name: Install packaged LLVM provider runtime dependencies
        if: matrix.needs_provider_archive == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages=$(python3 -c "import json; m=json.load(open('packaging/toolchains/${RELEASE_TARGET}.json')); print(' '.join(m['toolchain']['llvm_code_generator']['debian_packages']))")
          sudo apt-get update
          sudo apt-get install --yes $packages

      # One shared download cache per target: the base toolchain archive is
      # resolved (and verified against the digest the manifest pins) once and
      # then reused by the extraction below and by C-package staging, and the
      # separately pinned LLVM provider archive is resolved once for the llvm
      # package. Staging and assembly never download anything themselves.
      - name: Resolve the pinned release archives
        if: matrix.needs_base_toolchain == 'true'
        id: archives
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'oscan-archive-cache'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $manifestPath = "packaging/toolchains/${env:RELEASE_TARGET}.json"

          $toolchainArchive = & ./scripts/resolve-archive.ps1 `
            -ManifestPath $manifestPath `
            -Component toolchain `
            -DownloadDir $downloadDir `
            -Download | Select-Object -Last 1
          if (-not $toolchainArchive -or -not (Test-Path -LiteralPath $toolchainArchive -PathType Leaf)) {
            throw "Could not resolve the pinned toolchain archive for ${env:RELEASE_TARGET}."
          }
          "download_dir=$downloadDir" >> $env:GITHUB_OUTPUT
          "toolchain_archive=$toolchainArchive" >> $env:GITHUB_OUTPUT

          if ($env:RELEASE_NEEDS_PROVIDER_ARCHIVE -eq 'true') {
            $providerArchive = & ./scripts/resolve-archive.ps1 `
              -ManifestPath $manifestPath `
              -Component llvm-provider `
              -DownloadDir $downloadDir `
              -Download | Select-Object -Last 1
            if (-not $providerArchive -or -not (Test-Path -LiteralPath $providerArchive -PathType Leaf)) {
              throw "Could not resolve the pinned LLVM provider archive for ${env:RELEASE_TARGET}."
            }
            "provider_archive=$providerArchive" >> $env:GITHUB_OUTPUT
          }

      # Extracted once, from the archive already in the cache above, and used
      # only to build this target's runtime archives and to cut its
      # native-link sidecar. The packages themselves are staged from the
      # verified archive, never from this tree.
      - name: Extract the pinned toolchain
        if: matrix.needs_base_toolchain == 'true'
        shell: pwsh
        run: |
          & ./scripts/fetch-toolchain.ps1 `
            -ManifestPath "packaging/toolchains/${env:RELEASE_TARGET}.json" `
            -Destination "build/toolchain-${env:RELEASE_TARGET}" `
            -DownloadDir '${{ steps.archives.outputs.download_dir }}'
          if ($LASTEXITCODE -ne 0) {
            throw "Extracting the pinned toolchain for ${env:RELEASE_TARGET} failed."
          }

      # Built once per target with that target's pinned compiler/archiver and
      # shared by every object package of this target.
      - name: Build the freestanding runtime archives
        if: matrix.runtime_profiles != ''
        shell: pwsh
        run: |
          $target = $env:RELEASE_TARGET
          $manifestPath = "packaging/toolchains/$target.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json -AsHashtable
          $runtimeToolchain = $manifest['toolchain']['runtime']
          $toolchainDir = "build/toolchain-$target"
          if ($target.StartsWith('linux') -and
              -not (Test-Path "packaging/prebuilt/$target/libbearssl.a" -PathType Leaf)) {
            throw "Linux release archives for $target require packaging/prebuilt/$target/libbearssl.a; build or restore it before releasing"
          }
          $profiles = $env:RELEASE_RUNTIME_PROFILES.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          foreach ($runtimeProfile in $profiles) {
            Write-Host "::group::runtime archive $runtimeProfile ($target)"
            & ./scripts/build-runtime-archive.ps1 `
              -Target $target `
              -Mode $runtimeProfile `
              -CC (Join-Path $toolchainDir ([string]$runtimeToolchain['compiler']['path'])) `
              -AR (Join-Path $toolchainDir ([string]$runtimeToolchain['archiver']['path'])) `
              -ToolchainManifest $manifestPath `
              -OutDir "build/runtime-archives/$target"
            if ($LASTEXITCODE -ne 0) {
              throw "Building the $runtimeProfile runtime archive for $target failed."
            }
            Write-Host "::endgroup::"
          }

      # The verified, executable-relative native-link asset set (linker, its
      # sibling runtime libraries, import libraries, compiler builtins) that
      # every object package of this target ships as a sidecar. Prepared once;
      # release binaries embed nothing, so OSCAN_EMBED_ASSETS_DIR is never set
      # for the builds below.
      - name: Prepare the native-link sidecar
        if: matrix.needs_native_link == 'true'
        shell: pwsh
        run: |
          & ./scripts/prepare-embed-assets.ps1 `
            -Target ${env:RELEASE_TARGET} `
            -ToolchainDir "build/toolchain-${env:RELEASE_TARGET}" `
            -ToolchainManifest "packaging/toolchains/${env:RELEASE_TARGET}.json" `
            -OutputDir "build/native-link/${env:RELEASE_TARGET}"
          if ($LASTEXITCODE -ne 0) {
            throw "Preparing the native-link sidecar for ${env:RELEASE_TARGET} failed."
          }

      # One binary per backend, each built with exactly one backend feature
      # and stamped with the matching distribution backend, then copied to a
      # stable per-backend path before the next build overwrites
      # target/release.
      - name: Build the backend-specific compilers
        shell: pwsh
        run: |
          # A release binary consumes its verified sidecar at run time; it
          # must never carry embedded assets.
          Remove-Item Env:OSCAN_EMBED_ASSETS_DIR, Env:OSCAN_REQUIRE_EMBEDDED_ASSETS `
            -ErrorAction SilentlyContinue
          $backends = $env:RELEASE_BACKENDS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($backends.Count -eq 0) {
            throw "The release contract lists no backends for ${env:RELEASE_TARGET}."
          }
          $binRoot = Join-Path $env:RUNNER_TEMP 'oscan-release-binaries'
          foreach ($backend in $backends) {
            Write-Host "::group::cargo build --release --no-default-features --features backend-$backend"
            $env:OSCAN_DISTRIBUTION_BACKEND = $backend
            $env:OSCAN_VERSION = $env:RELEASE_TAG
            & cargo build --release --no-default-features --features "backend-$backend"
            if ($LASTEXITCODE -ne 0) {
              throw "cargo build failed for backend '$backend'."
            }
            if (-not (Test-Path -LiteralPath $env:RELEASE_BINARY_PATH -PathType Leaf)) {
              throw "cargo produced no binary at ${env:RELEASE_BINARY_PATH} for backend '$backend'."
            }
            $destinationDir = Join-Path $binRoot $backend
            New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
            Copy-Item -LiteralPath $env:RELEASE_BINARY_PATH `
              -Destination (Join-Path $destinationDir $env:RELEASE_BINARY_NAME) -Force
            Write-Host "::endgroup::"
          }

      # Each variant is assembled from only the prepared inputs its component
      # list declares, and smoked immediately: an archive is never uploaded
      # before the package it contains has been installed and exercised.
      - name: Assemble and smoke every backend package
        shell: pwsh
        run: |
          $target = $env:RELEASE_TARGET
          $version = $env:RELEASE_VERSION
          $contract = Get-Content 'packaging/toolchains/release-contract.json' -Raw |
            ConvertFrom-Json -AsHashtable
          $variants = $contract['variants'][$target]['backends']
          $backends = $env:RELEASE_BACKENDS.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          $binRoot = Join-Path $env:RUNNER_TEMP 'oscan-release-binaries'
          $outputDir = Join-Path $env:RUNNER_TEMP 'oscan-release-artifacts'
          $uploadDir = Join-Path $env:GITHUB_WORKSPACE 'release-upload'
          New-Item -ItemType Directory -Path $uploadDir -Force | Out-Null
          $toolchainArchive = '${{ steps.archives.outputs.toolchain_archive }}'
          $providerArchive = '${{ steps.archives.outputs.provider_archive }}'
          $produced = @()

          foreach ($backend in $backends) {
            if (-not $variants.ContainsKey($backend)) {
              throw "The release contract has no $target/$backend variant."
            }
            $variant = $variants[$backend]
            $components = @($variant['components'])
            $binary = Join-Path (Join-Path $binRoot $backend) $env:RELEASE_BINARY_NAME
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "No $backend compiler was built for $target (expected $binary)."
            }

            $assembleArgs = @{
              Target = $target
              Backend = $backend
              Version = $version
              BinaryPath = $binary
              OutputDir = $outputDir
            }
            if ($components -contains 'direct_link_sidecar') {
              $nativeLinkDir = "build/native-link/$target"
              if (-not (Test-Path -LiteralPath $nativeLinkDir)) {
                throw "$target/$backend needs a prepared native-link sidecar, but $nativeLinkDir is missing."
              }
              $assembleArgs['NativeLinkDir'] = (Resolve-Path -LiteralPath $nativeLinkDir).Path
            }
            if (@($variant['runtime_profiles']).Count -gt 0) {
              $runtimeArchiveDir = "build/runtime-archives/$target"
              if (-not (Test-Path -LiteralPath $runtimeArchiveDir)) {
                throw "$target/$backend needs prebuilt runtime archives, but $runtimeArchiveDir is missing."
              }
              $assembleArgs['PrebuiltRuntimeArchiveDir'] = (Resolve-Path -LiteralPath $runtimeArchiveDir).Path
            }
            if ($components -contains 'c_toolchain') {
              if (-not $toolchainArchive) {
                throw "$target/$backend needs the pinned C toolchain archive, which was not resolved."
              }
              $assembleArgs['ToolchainArchive'] = $toolchainArchive
            }
            if ($components -contains 'llvm_provider' -and
                $variant['llvm_provider_source'] -eq 'toolchain-manifest') {
              if (-not $providerArchive) {
                throw "$target/$backend needs the pinned LLVM provider archive, which was not resolved."
              }
              $assembleArgs['LlvmProviderArchive'] = $providerArchive
            }

            Write-Host "::group::assemble $target/$backend"
            $archivePath = & ./scripts/assemble-release.ps1 @assembleArgs | Select-Object -Last 1
            if (-not $archivePath -or -not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
              throw "Assembling $target/$backend produced no archive."
            }
            Write-Host "::endgroup::"

            Write-Host "::group::smoke $target/$backend"
            & ./scripts/smoke-release.ps1 `
              -Target $target `
              -Backend $backend `
              -ArchivePath $archivePath `
              -Version $version `
              -ScratchDir (Join-Path $env:RUNNER_TEMP "oscan-release-smoke/$target-$backend")
            Write-Host "::endgroup::"

            $archiveName = Split-Path -Path $archivePath -Leaf
            if ($produced -contains $archiveName) {
              throw "Two $target packages claim the same archive name '$archiveName'."
            }
            $produced += $archiveName
            Copy-Item -LiteralPath $archivePath -Destination (Join-Path $uploadDir $archiveName) -Force
          }

          $expected = $env:RELEASE_ARCHIVES.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($produced.Count -eq 0) {
            throw "No packages were produced for $target."
          }
          $missing = @($expected | Where-Object { $produced -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "The release contract expects packages this job did not produce: $($missing -join ', ')."
          }
          $unexpected = @($produced | Where-Object { $expected -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            throw "This job produced packages the release contract does not declare: $($unexpected -join ', ')."
          }
          Write-Host "Packaged and smoked: $($produced -join ', ')"
          $LASTEXITCODE = 0

      # One installer, for the recommended package. The MSI is cut from the
      # staged bundle directory the assemble step above left in place, so it
      # contains exactly what the verified archive contains.
      - name: Build the recommended MSI installer
        if: matrix.msi_backend != ''
        shell: pwsh
        run: |
          $target = $env:RELEASE_TARGET
          $backend = $env:RELEASE_MSI_BACKEND
          $version = $env:RELEASE_VERSION
          $contract = Get-Content 'packaging/toolchains/release-contract.json' -Raw |
            ConvertFrom-Json -AsHashtable
          $variant = $contract['variants'][$target]['backends'][$backend]
          $bundleName = ([string]$variant['archive_root_template']).Replace('{version}', $version)
          $outputDir = Join-Path $env:RUNNER_TEMP 'oscan-release-artifacts'
          $bundleDir = Join-Path (Join-Path $outputDir 'stage') $bundleName
          if (-not (Test-Path -LiteralPath $bundleDir -PathType Container)) {
            throw "The staged $target/$backend bundle is missing at $bundleDir; the MSI must be built from the bundle that was packaged and smoked."
          }
          $uploadDir = Join-Path $env:GITHUB_WORKSPACE 'release-upload'
          New-Item -ItemType Directory -Path $uploadDir -Force | Out-Null
          $msiPath = Join-Path $uploadDir "$bundleName.msi"
          & ./scripts/build-msi.ps1 -BundleDir $bundleDir -Version $version -OutputPath $msiPath
          if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) {
            throw "The MSI build produced no installer at $msiPath."
          }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: release-upload/
          if-no-files-found: error

  checksums:
    name: Compute release checksums
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path upload -Force | Out-Null
          $files = Get-ChildItem -Path release-artifacts -Recurse -File | Where-Object {
            $_.Name -match '\.(zip|msi|tar\.gz|tar\.xz)$'
          } | Sort-Object Name
          if (-not $files) {
            throw 'No packaged release assets were downloaded.'
          }
          $duplicates = $files | Group-Object Name | Where-Object { $_.Count -gt 1 }
          if ($duplicates) {
            throw "Duplicate release asset name(s): $(($duplicates.Name) -join ', ')."
          }
          & ./scripts/write-checksums.ps1 -OutputPath upload/SHA256SUMS @($files.FullName)

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: upload/SHA256SUMS

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.should_publish == 'true'
    needs:
      - prepare
      - package
      - checksums
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( -name '*.zip' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.tar.xz' -o -name 'SHA256SUMS' \) -exec cp {} upload/ \;
          if [ -z "$(ls -A upload)" ]; then
            echo "no release assets were collected" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: upload/*
